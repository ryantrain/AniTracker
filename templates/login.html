<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/outputlogin.css') }}">
    <script src="{{ url_for('static', filename='./js/login.js') }} " type="module" ></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='./images/favicon.ico') }}">
    <title>Login - AniTracker</title>
</head>

    <header>
        <a href="/">ANITRACKER</a>
    </header>

    <a class="sign-in-text">Sign in</a>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="login-container">
            <input id="username" type="text" name="username" placeholder="Username*"/>
            <input id="password" type="password" name="password" placeholder="Password*"/>
        </div>

        <div class="action-row">
            <button type="submit" class="action-button" id="login-button">Login</button>
            <a href="/register/" class="action-button">Register</a>
        </div>
    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error-message">
                {% for message in messages %}
                    {{message}}
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

</body>

</html>
