<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/outputprofile.css') }}">
    <script src="{{ url_for('static', filename='./js/profile.js') }} " defer ></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='./images/favicon.ico') }}">
    <title>
        Profile - AniTracker
    </title>
</head>

<header>

    <div class="search-bar-backdrop"></div>

    <input type='checkbox' id='nav-toggle' class='nav-toggle'>

    <div class="nav-backdrop"></div>

    <div class="profile-icon-backdrop"></div>

    <label for='nav-toggle' class='nav-toggle-label'>
        <svg fill="#FFFFFF" style="margin-left: 5px;" width="30" height="30" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64px" height="64px" viewBox="0 0 24.75 24.75" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <path d="M0,3.875c0-1.104,0.896-2,2-2h20.75c1.104,0,2,0.896,2,2s-0.896,2-2,2H2C0.896,5.875,0,4.979,0,3.875z M22.75,10.375H2 c-1.104,0-2,0.896-2,2c0,1.104,0.896,2,2,2h20.75c1.104,0,2-0.896,2-2C24.75,11.271,23.855,10.375,22.75,10.375z M22.75,18.875H2 c-1.104,0-2,0.896-2,2s0.896,2,2,2h20.75c1.104,0,2-0.896,2-2S23.855,18.875,22.75,18.875z"></path> </g> </g></svg>
    </label>

    <nav class="nav">
        <label for='nav-toggle' class='nav-toggle-label'>
            <svg fill="#FFFFFF" style="margin-left: 5px;" width="30" height="30" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="64px" height="64px" viewBox="0 0 24.75 24.75" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <path d="M0,3.875c0-1.104,0.896-2,2-2h20.75c1.104,0,2,0.896,2,2s-0.896,2-2,2H2C0.896,5.875,0,4.979,0,3.875z M22.75,10.375H2 c-1.104,0-2,0.896-2,2c0,1.104,0.896,2,2,2h20.75c1.104,0,2-0.896,2-2C24.75,11.271,23.855,10.375,22.75,10.375z M22.75,18.875H2 c-1.104,0-2,0.896-2,2s0.896,2,2,2h20.75c1.104,0,2-0.896,2-2S23.855,18.875,22.75,18.875z"></path> </g> </g></svg>
        </label>

        <div class="nav-logo">
            <a href="/">ANITRACKER</a>
        </div>

        <a class="nav-item" href="/">Home</a>

        {% if current_user.is_authenticated %}
            <a class="nav-item" href="{{ url_for('bookmarks') }}">Bookmarks</a>
        {% endif %}

    </nav>

    <div class="interactive-box">
        <a href="{{ url_for('home') }}">ANITRACKER</a>
    </div>

    <form action="{{url_for('search')}}" method="POST" class="search-form">
        <div class="search-bar">
            <input id="search-query" type="text" name="Search_Bar" placeholder="Search..."/>

            <div class="search-bar-dropdown"></div>
        </div>
    </form>
   

    {% if not current_user.is_authenticated %}

        <a href="{{ url_for('login', next=request.url) }}" class="credential-button">LOGIN</a>

        <a href="{{ url_for('register') }}" class="credential-button">REGISTER</a>

    {% else %}

        <img src=" {{ url_for ('static', filename='./images/default-icon.png') }} " id="profile-icon" alt="Profile Icon" class="profile-icon"/>

        <div class="profile-menu-dropdown">
            <a href="{{ url_for('profile', username=current_user.username) }}" class="profile-menu-item">Profile</a>

            <form method="POST" action="{{ url_for('profile', username=current_user.username) }}">
                <input type="submit" id='logout' name="logout" class="profile-menu-item" value="Logout"/>
            </form>

        </div>

    {% endif %}

</header>

<body>

    <div class="rect"></div>

    {% if current_user.is_authenticated and current_user.id == user.id %}
    
        <img src="{{ url_for ('static', filename='./images/' + user.profile_picture ) }} " class="profile-picture" alt="{{ user.username }} profile picture">

        <form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" class="profile-picture-card">

            <label for="profile_picture_upload" class="profile-picture-button">Choose photo</label>
            <input id="profile_picture_upload" type="file" name="profile_picture_upload" accept="image/*" class="profile-picture-input" onchange="this.form.submit()">

        </form>

    {% else %}

        <img src="{{ url_for ('static', filename='./images/' + user.profile_picture ) }} " class="profile-picture" alt="{{ user.username }} profile picture">
    
    {% endif %}
    <a class="profile-name">{{ user.username }}</a>

</body>

</html>
